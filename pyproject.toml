[project]
name = "tts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.38.18",
    "boto3-stubs[essential]>=1.38.18",
    "fastapi>=0.115.12",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "jupyterlab>=4.4.2",
    "mangum>=0.19.0",
    "matplotlib>=3.10.3",
    "notebook>=7.4.2",
    "num2words>=0.5.14",
    "numpy>=2.2.6",
    "pandas>=2.2.3",
    "python-multipart>=0.0.20",
    "requests>=2.32.3",
    "scipy>=1.15.3",
    "sqlalchemy-libsql>=0.1.0",
    "sqlmodel>=0.0.24",
    "streamlit>=1.45.1",
    "torch>=2.7.0",
    "transformers>=4.51.3",
    "typer[all]>=0.15.4",
    "uvicorn>=0.34.2",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128",  marker = "platform_system != 'Darwin'"},
]
torchvision = [
  { index = "pytorch-cu128", marker = "platform_system != 'Darwin'"},
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
